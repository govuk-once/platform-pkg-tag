
name: Sonar Scan

on:
  push:
    branches:
      - main
      - GUOIT-201

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node/PNPM
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          install: false
          runtime: node@24

      - name: Configure CodeArtifact auth
        id: code-artifact-auth
        uses: govuk-once/platform-actions-codeartifact-login/.github/actions/codeartifact-auth@fa3a856eb7285b0624cdfdcd436ef72fbf15547c
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spellcheck
        run: pnpm run spg

      - name: Run Tests
        run: pnpm run test

      - name: Check SonarCloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing"
            exit 1
          fi
          echo "SonarCloud token is available"

      - name: Run SonarQube Scan
        id: sonar-scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud Security Findings to Jira
        continue-on-error: true
        if: >-
          ${{
            always() &&
            !cancelled() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'
          }}
        env:
          SONAR_URL: https://sonarcloud.io
          SONAR_TOKEN_PLATFORM: ${{ secrets.SONAR_TOKEN }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DRY_RUN: 'false'
        run: |
          pnpm exec tsx scripts/sonarToJira.ts