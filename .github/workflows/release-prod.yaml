name: Publish Tag Helpers (production)
on:
  push:
    tags:
      - 'v*'
    paths:
      - "**.ts"
      - "**.json"
      - "**.mts"
      - "lib/**"
      - ".github/**.yaml"
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish Tag Helpers
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure CodeArtifact auth
        id: code-artifact-auth
        uses: govuk-once/platform-actions/.github/actions/codeartifact-auth@a9d920242b6f20f993afec11e9cc6a67bb47ccde # PR commit - brings in always-auth
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          package-manager: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Publish Package to CodeArtifact
        run: pnpm publish --no-git-checks
