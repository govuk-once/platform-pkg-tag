name: CDK PR
on:
  pull_request:
    branches: [main]
    paths: 
      - '**.ts'
      - '**.json'
      - '**.mts'
      - 'lib/**'

permissions:
  id-token: write
  contents: read

jobs:
  test-cdk:
    name: Run CDK Unit Tests and Validation
    environment: development
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v6

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GH-Actions-Tag-Pipeline

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
  
      - name: Configure CodeArtifact auth
        uses: govuk-once/platform-actions/.github/actions/codeartifact-auth@7d9a5af9d60564f688328ef213c7e8ba3644766f # PR commit - brings in always-auth
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}

      - name: Install dependencies
        run: "pnpm install"

      - name: Spellcheck
        run: "pnpm run spg"

      - name: Run Tests
        run: "pnpm run test"

